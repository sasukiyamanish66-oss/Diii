name: TEST MITRA - Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Extract TEST MITRA ZIP
        shell: bash
        run: |
          set -e

          echo "Searching for TEST MITRA ZIP..."

          ZIP_FILE=$(find . -maxdepth 2 -type f -name "TEST-MITRA-GITHUB-APK-READY.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: TEST-MITRA-GITHUB-APK-READY.zip not found"
            exit 1
          fi

          echo "Found: $ZIP_FILE"

          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          echo "ZIP extracted successfully."

          echo "Extracted files:"
          find extracted -maxdepth 4 -type f | head -100

      - name: Find Android project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          SETTINGS_FILE=$(find extracted \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle or settings.gradle.kts not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Android project found:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Check Android project
        shell: bash
        run: |
          set -e

          echo "Project directory:"
          echo "$PROJECT_DIR"

          echo "Project files:"
          ls -la "$PROJECT_DIR"

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "ERROR: app folder not found"
            exit 1
          fi

          echo "app folder found successfully."

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Building TEST MITRA APK..."

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "Searching for APK..."

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TEST-MITRA-APK
          path: |
            extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
